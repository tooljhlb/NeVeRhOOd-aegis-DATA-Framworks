[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aegis-multimodal-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "numpy>=1.24,<3"]
[project.optional-dependencies]
eval = ["sacrebleu>=2.4,<3", "rouge-score>=0.1.2,<0.2", "scipy>=1.11,<2"]
data = ["datasets>=3,<5"]
[project.scripts]
aegis-lab = "aegis.cli:main"
[tool.setuptools.packages.find]
include = ["aegis*"]
